[package]
name = "xhs-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Native Rust Xiaohongshu API CLI"
repository = "https://github.com/OpenMedia-Lab/xhs-cli"
[[bin]]
name = "xhs"
path = "src/main.rs"
[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
base64 = "0.22"
md5 = "0.7"
rand = "0.8"
aes = "0.8"
cbc = {version="0.1", features=["alloc"]}
hex = "0.4"
crc32fast = "1"
url = "2"
qrcode = { version="0.14", default-features=false, features=["svg"] }
